
<div class="dialog-backdrop" (click)="cancelDelete()">
  <div
    class="dialog-box"
    role="dialog"
    aria-modal="true"
    aria-labelledby="dialog-title"
    (click)="$event.stopPropagation()"
  >
    <div class="dialog-icon">!</div>

    <h2 id="dialog-title">{{ title }}</h2>

    <p>{{ message }}</p>

    <div class="dialog-actions">
      <button
        type="button"
        class="cancel-button"
        (click)="cancelDelete()"
      >
        Cancel
      </button>

      <button
        type="button"
        class="delete-button"
        (click)="confirmDelete()"
      >
        Delete
      </button>
    </div>
  </div>
</div>
